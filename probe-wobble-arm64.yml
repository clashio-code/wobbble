name: Probe Wobble Up ARM64
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-wobble-arm64.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Write read-only ELF probe and launcher
        run: |
          mkdir -p src out/wobble_probe
          cat > src/elfprobe.c <<'EOF_C'
          #define _GNU_SOURCE
          #include <elf.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <unistd.h>
          #include <gnu/libc-version.h>

          static const char *names[] = { "libmain.so", "libil2cpp.so", "libunity.so", NULL };
          static void inspect(const char *path) {
            int fd = open(path, O_RDONLY); struct stat st; const unsigned char *p; const Elf64_Ehdr *e;
            const Elf64_Phdr *ph; const Elf64_Dyn *dyn = NULL; size_t i, nd = 0; uint64_t strtab = 0, strsz = 0;
            const char *str = NULL; uint64_t soname = 0; int loads = 0, tls = 0;
            if (fd < 0) { printf("MISSING: %s\n", path); return; }
            if (fstat(fd, &st) || st.st_size < (off_t)sizeof(Elf64_Ehdr)) { printf("BAD_FILE: %s\n", path); close(fd); return; }
            p = mmap(NULL, st.st_size, PROT_READ, MAP_PRIVATE, fd, 0); close(fd);
            if (p == MAP_FAILED) { printf("MMAP_FAIL: %s\n", path); return; }
            e = (const Elf64_Ehdr *)p;
            if (memcmp(e->e_ident, ELFMAG, SELFMAG) || e->e_ident[EI_CLASS] != ELFCLASS64 || e->e_machine != EM_AARCH64 || e->e_phentsize != sizeof(Elf64_Phdr) || e->e_phoff + (uint64_t)e->e_phnum * sizeof(Elf64_Phdr) > (uint64_t)st.st_size) {
              printf("NOT_AARCH64_ELF64: %s\n", path); munmap((void *)p, st.st_size); return;
            }
            ph = (const Elf64_Phdr *)(p + e->e_phoff);
            for (i = 0; i < e->e_phnum; i++) {
              if (ph[i].p_type == PT_LOAD) loads++;
              if (ph[i].p_type == PT_TLS) tls++;
              if (ph[i].p_type == PT_DYNAMIC && ph[i].p_offset + ph[i].p_filesz <= (uint64_t)st.st_size) { dyn = (const Elf64_Dyn *)(p + ph[i].p_offset); nd = ph[i].p_filesz / sizeof(Elf64_Dyn); }
            }
            for (i = 0; dyn && i < nd && dyn[i].d_tag != DT_NULL; i++) {
              if (dyn[i].d_tag == DT_STRTAB) strtab = dyn[i].d_un.d_ptr;
              else if (dyn[i].d_tag == DT_STRSZ) strsz = dyn[i].d_un.d_val;
              else if (dyn[i].d_tag == DT_SONAME) soname = dyn[i].d_un.d_val;
            }
            for (i = 0; i < e->e_phnum && strtab; i++) if (ph[i].p_type == PT_LOAD && strtab >= ph[i].p_vaddr && strtab - ph[i].p_vaddr < ph[i].p_filesz) { str = (const char *)(p + ph[i].p_offset + (strtab - ph[i].p_vaddr)); break; }
            printf("\nELF: %s\n  type=%u entry=0x%llx loads=%d TLS=%d\n", path, e->e_type, (unsigned long long)e->e_entry, loads, tls);
            if (!dyn || !str || !strsz) printf("  Dynamic table/string table unavailable\n");
            else {
              if (soname < strsz) printf("  SONAME: %s\n", str + soname);
              for (i = 0; i < nd && dyn[i].d_tag != DT_NULL; i++) if (dyn[i].d_tag == DT_NEEDED && dyn[i].d_un.d_val < strsz) printf("  NEEDED: %s\n", str + dyn[i].d_un.d_val);
              for (i = 0; i < nd && dyn[i].d_tag != DT_NULL; i++) if (dyn[i].d_tag == DT_RPATH || dyn[i].d_tag == DT_RUNPATH) { uint64_t x = dyn[i].d_un.d_val; if (x < strsz) printf("  RUNPATH/RPATH: %s\n", str + x); }
            }
            munmap((void *)p, st.st_size);
          }
          int main(int argc, char **argv) {
            struct utsname u; size_t i; char path[1024]; const char *dir = argc > 1 ? argv[1] : "libs";
            printf("Wobble Up ARM64 ELF compatibility probe (read-only; does not load or execute game libraries)\n");
            if (uname(&u) == 0) printf("DEVICE: %s %s %s %s\n", u.sysname, u.release, u.machine, u.version);
            printf("POINTER_BITS: %u\n", (unsigned)(sizeof(void *) * 8));
            printf("GLIBC: %s\n", gnu_get_libc_version());
            for (i = 0; names[i]; i++) { snprintf(path, sizeof path, "%s/%s", dir, names[i]); inspect(path); }
            printf("\nProbe complete. Send this full report back.\n"); return 0;
          }
          EOF_C
          cat > out/wobble_probe/wobble-probe.sh <<'EOF_SH'
          #!/bin/sh
          set -u
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          cd "$HERE" || exit 1
          OUT="$HERE/probe-report.txt"
          chmod +x ./elfprobe
          ./elfprobe ./libs > "$OUT" 2>&1
          cat "$OUT"
          sync
          EOF_SH
          chmod +x out/wobble_probe/wobble-probe.sh
      - name: Compile AArch64 probe
        run: |
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o out/wobble_probe/elfprobe src/elfprobe.c
          aarch64-linux-gnu-strip out/wobble_probe/elfprobe
          file out/wobble_probe/elfprobe
          aarch64-linux-gnu-readelf -h out/wobble_probe/elfprobe | grep -E 'Class|Machine'
          aarch64-linux-gnu-readelf -V out/wobble_probe/elfprobe | grep -o 'GLIBC_[0-9.]*' | sort -uV
      - name: Package minimal game libraries for probe
        run: |
          mkdir -p out/wobble_probe/libs
          cp "$GITHUB_WORKSPACE"/config.arm64_v8a/lib/arm64-v8a/libmain.so out/wobble_probe/libs/
          cp "$GITHUB_WORKSPACE"/config.arm64_v8a/lib/arm64-v8a/libil2cpp.so out/wobble_probe/libs/
          cp "$GITHUB_WORKSPACE"/config.arm64_v8a/lib/arm64-v8a/libunity.so out/wobble_probe/libs/
          find out/wobble_probe -maxdepth 2 -type f -printf '%P %s bytes\n'
      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: wobble-up-arm64-probe
          path: out/wobble_probe/
