          static const char *group_of(const char *n) {
            static const char *const g[] = { "AMedia", "AHardwareBuffer", "AImageReader", "ANativeWindow", "AInput", "AKeyEvent", "AMotionEvent", "ASensor", "ALooper", "AAsset",
              "AConfiguration", "ACameraManager", "AChoreographer", "ANativeActivity", "AAudio", "AndroidBitmap", "OpenSLES", "SL_", "slCreateEngine", "egl", "gl", "vk", "__android", "android_",
