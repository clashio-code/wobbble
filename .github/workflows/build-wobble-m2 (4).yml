          typedef void (*nfn)(void *, void *, ...);
          static void *unity_thread(void *arg) {
            Native *n_init, *n_rec, *n_chg, *n_res, *n_foc, *n_ren; void *self = mk_obj("com/unity3d/player/UnityPlayer"), *ctx = mk_obj("android/app/Activity"), *surf = mk_obj("android/view/Surface");
            void *env = (void *)&g_envobj; stack_t ss; struct timespec t0, t1; unsigned long frames = 0; int r = 1;
            (void)arg;
            ss.ss_sp = malloc(1u << 17); ss.ss_size = 1u << 17; ss.ss_flags = 0; if (ss.ss_sp) sigaltstack(&ss, NULL);
            tm_add(b_gettid(), pthread_self()); pthread_setname_np(pthread_self(), "UnityMain");
            n_init = find_native("UnityPlayer", "initJni"); n_rec = find_native("UnityPlayer", "nativeRecreateGfxState"); n_chg = find_native("UnityPlayer", "nativeSendSurfaceChangedEvent");
            n_res = find_native("UnityPlayer", "nativeResume"); n_foc = find_native("UnityPlayer", "nativeFocusChanged"); n_ren = find_native("UnityPlayer", "nativeRender");
            if (!n_init || !n_rec || !n_res || !n_foc || !n_ren) { L("[m2] native inti tidak lengkap\n"); g_m2_done = 1; return NULL; }
            L("\n== M2: meniru urutan UnityPlayer.java ==\n[m2] initJni(context)\n");
            ((nfn)n_init->fn)(env, self, ctx);
            L("[m2] initJni selesai\n[m2] nativeRecreateGfxState(0, surface)\n");
            ((nfn)n_rec->fn)(env, self, 0, surf);
            if (n_chg) { L("[m2] nativeSendSurfaceChangedEvent()\n"); ((nfn)n_chg->fn)(env, self); }
            L("[m2] nativeResume()\n"); ((nfn)n_res->fn)(env, self);
            L("[m2] nativeFocusChanged(true)\n"); ((nfn)n_foc->fn)(env, self, 1);
            L("[m2] masuk loop nativeRender() (target %ld frame)\n", g_frames_target);
            clock_gettime(CLOCK_MONOTONIC, &t0);
            while (frames < (unsigned long)g_frames_target) {
              r = ((uint8_t (*)(void *, void *))n_ren->fn)(env, self) & 0xff; frames++; g_m2_frames = frames;
              if (frames <= 3 || frames % 120 == 0) L("[m2] nativeRender #%lu -> %d | eglSwapBuffers=%lu\n", frames, r, g_gfx.swaps);
              if (!r) { L("[m2] nativeRender mengembalikan false (Unity minta berhenti)\n"); break; }
            }
            clock_gettime(CLOCK_MONOTONIC, &t1);
            { double s = (double)(t1.tv_sec - t0.tv_sec) + (double)(t1.tv_nsec - t0.tv_nsec) / 1e9;
              L("[m2] SELESAI: %lu panggilan nativeRender dalam %.2f detik = %.1f fps | eglSwapBuffers=%lu\n", frames, s, s > 0 ? (double)frames / s : 0.0, g_gfx.swaps); }
            g_m2_done = 1;
            return NULL;
          }

          static void m2_run(void) {
            pthread_t th; pthread_attr_t at; unsigned char ev[64]; int waited = 0;
            L("\n== STAGE 3 (M2): grafis + UnityMain ==\n");
            if (gfx_setup() != 0) { L("[m2] GAGAL menyiapkan grafis; berhenti.\n"); return; }
            pthread_attr_init(&at); pthread_attr_setstacksize(&at, 8u << 20);
            if (pthread_create(&th, &at, unity_thread, NULL) != 0) { L("[m2] gagal membuat thread UnityMain\n"); return; }
            while (!g_m2_done) {
              while (p_SDL_PollEvent(ev)) {
                uint32_t type; memcpy(&type, ev, 4);
                if (type == 0x100) { L("[m2] SDL_QUIT -> berhenti\n"); g_m2_done = 1; }
                if (type == 0x300) { uint32_t sym; memcpy(&sym, ev + 20, 4); if (sym == 27) { L("[m2] ESC -> berhenti\n"); g_m2_done = 1; } }
              }
              usleep(10000);
              if (++waited % 300 == 0) L("[m2] detak: %d detik | nativeRender=%lu | eglSwapBuffers=%lu\n", waited / 100, g_m2_frames, g_gfx.swaps);
            }
            L("[m2] selesai (frame=%lu, swap=%lu, screenshot: shot_*.bmp)\n", g_m2_frames, g_gfx.swaps);
          }

          /* uji mandiri jembatan EGL (jalan di mana saja yang punya SDL2+EGL, termasuk sandbox): meminjamkan konteks SDL ke thread lain seperti Unity */
