              L("  host %-16s : %s\n", names[i], h ? "OK" : "tidak ada");
              if (h && n_host < 8) h_host[n_host++] = h;
              if (h && !strcmp(names[i], "libEGL.so.1")) h_egl = h;
              if (h && !strcmp(names[i], "libGLESv2.so.2")) h_gles = h;
              if (h && !strcmp(names[i], "libz.so.1")) h_z = h;
