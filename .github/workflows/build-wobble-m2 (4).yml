              pthread_mutexattr_init(&a); pthread_mutexattr_settype(&a, t); pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
              nv = __sync_val_compare_and_swap(g, v, (uint64_t)(uintptr_t)m);
              if (nv == v) return m;
              pthread_mutex_destroy(m); free(m);
            }
          }
