                for (x = 0; x < w; x++) { const unsigned char *p = px + ((size_t)y * (size_t)w + (size_t)x) * 4; row[x * 3] = p[2]; row[x * 3 + 1] = p[1]; row[x * 3 + 2] = p[0]; }
