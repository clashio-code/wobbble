          static void init_ctype(void) {   /* flags bionic: _U 1, _L 2, _N 4, _S 8, _P 0x10, _C 0x20, _X 0x40, _B 0x80 */
            int c;
            for (c = 0; c < 256; c++) {
              unsigned f = 0;
              if (c >= 'A' && c <= 'Z') f |= 0x01;
              if (c >= 'a' && c <= 'z') f |= 0x02;
              if (c >= '0' && c <= '9') f |= 0x04;
              if (c == ' ' || (c >= 9 && c <= 13)) f |= 0x08;
              if (c > 32 && c < 127 && !((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9'))) f |= 0x10;
              if (c < 32 || c == 127) f |= 0x20;
              if ((c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F')) f |= 0x40;
              if (c == ' ') f |= 0x80;
              bionic_ctype[1 + c] = (unsigned char)f;
            }
          }
