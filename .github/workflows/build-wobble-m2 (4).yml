          static pthread_mutex_t *mget(void *gp) {
            volatile uint64_t *g = (volatile uint64_t *)gp;
            for (;;) {
              uint64_t v = *g, nv; pthread_mutex_t *m; pthread_mutexattr_t a; int t;
              if (v >= PTRMIN) return (pthread_mutex_t *)(uintptr_t)v;
