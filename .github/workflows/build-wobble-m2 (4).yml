            for (i = 0; i < 70; i++) { cc((float)i / 70.f, 0.4f, 0.8f, 1.f); cl(0x4000); s_eglSwapBuffers(dpy, surf); }
            return NULL;
          }
          static int gfx_selftest(void) {
            pthread_t th; FILE *f;
