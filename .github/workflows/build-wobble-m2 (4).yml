              if (act && act->handler >= 2) {
                char b[300]; describe_addr((uintptr_t)act->handler, b, sizeof b);
                if (old) { if (g_gh_set[sig]) *old = g_gh[sig]; else memset(old, 0, sizeof *old); }
                g_gh[sig] = *act; g_gh_set[sig] = 1;
                L("[SHIM] sigaction(%d): handler game %s -> RANTAI loader\n", sig, b);
