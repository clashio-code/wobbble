                L("== NativeLoader.load(\"%s\") ...\n", arg);
                r = ((uint8_t (*)(void *, void *, void *))nl->fn)((void *)&g_envobj, mk_handle("com/unity3d/player/NativeLoader"), mk_handle(arg)) & 0xff;
                L("== NativeLoader.load -> %d\n", r);
                if (!r && !g_loadarg[0]) {
                  char full[400]; snprintf(full, sizeof full, "%s/libunity.so", g_libdir);
                  L("== ulangi NativeLoader.load(\"%s\") ...\n", full);
                  r = ((uint8_t (*)(void *, void *, void *))nl->fn)((void *)&g_envobj, mk_handle("com/unity3d/player/NativeLoader"), mk_handle(full)) & 0xff;
                  L("== NativeLoader.load -> %d\n", r);
                }
              } else L("NativeLoader.load tidak terdaftar oleh libmain\n");
              if (lunity) {
                ensure_ctors(lunity);
                if (!has_natives_of("UnityPlayer")) call_jni_onload(lunity);
              }
            }
            if (g_stage >= 3 && lunity && has_natives_of("UnityPlayer")) m2_run();
            summary();
            L("\n== selesai tanpa crash (stage %d) ==\n", g_stage);
            fflush(NULL);
            _exit(0);   /* hindari destruktor atexit milik game */
          }
          EOF_C1
          cat > src/gen_stubs.py <<'EOF_PY'
          # Menghasilkan stubs.inc: nama slot JNI + 256 stub JNI + 512 stub simbol-tak-terselesaikan
          types = ["Object","Boolean","Byte","Char","Short","Int","Long","Float","Double","Void"]
          prims = ["Boolean","Byte","Char","Short","Int","Long","Float","Double"]
          n = {}
          for i in range(4): n[i] = "reserved%d" % i
          n[4]="GetVersion"; n[5]="DefineClass"; n[6]="FindClass"; n[7]="FromReflectedMethod"; n[8]="FromReflectedField"
          n[9]="ToReflectedMethod"; n[10]="GetSuperclass"; n[11]="IsAssignableFrom"; n[12]="ToReflectedField"
          n[13]="Throw"; n[14]="ThrowNew"; n[15]="ExceptionOccurred"; n[16]="ExceptionDescribe"; n[17]="ExceptionClear"
          n[18]="FatalError"; n[19]="PushLocalFrame"; n[20]="PopLocalFrame"; n[21]="NewGlobalRef"; n[22]="DeleteGlobalRef"
          n[23]="DeleteLocalRef"; n[24]="IsSameObject"; n[25]="NewLocalRef"; n[26]="EnsureLocalCapacity"
          n[27]="AllocObject"; n[28]="NewObject"; n[29]="NewObjectV"; n[30]="NewObjectA"
          n[31]="GetObjectClass"; n[32]="IsInstanceOf"; n[33]="GetMethodID"
          i = 34
          for t in types:
              for s in ("", "V", "A"): n[i] = "Call%sMethod%s" % (t, s); i += 1
          for t in types:
              for s in ("", "V", "A"): n[i] = "CallNonvirtual%sMethod%s" % (t, s); i += 1
          assert i == 94
          n[94]="GetFieldID"; i = 95
          for t in types[:9]: n[i] = "Get%sField" % t; i += 1
          for t in types[:9]: n[i] = "Set%sField" % t; i += 1
          assert i == 113
          n[113]="GetStaticMethodID"; i = 114
          for t in types:
              for s in ("", "V", "A"): n[i] = "CallStatic%sMethod%s" % (t, s); i += 1
          assert i == 144
          n[144]="GetStaticFieldID"; i = 145
          for t in types[:9]: n[i] = "GetStatic%sField" % t; i += 1
          for t in types[:9]: n[i] = "SetStatic%sField" % t; i += 1
          assert i == 163
          for k, nm in enumerate(["NewString","GetStringLength","GetStringChars","ReleaseStringChars","NewStringUTF",
                                  "GetStringUTFLength","GetStringUTFChars","ReleaseStringUTFChars","GetArrayLength",
                                  "NewObjectArray","GetObjectArrayElement","SetObjectArrayElement"]):
              n[163 + k] = nm
          i = 175
          for t in prims: n[i] = "New%sArray" % t; i += 1
          for t in prims: n[i] = "Get%sArrayElements" % t; i += 1
          for t in prims: n[i] = "Release%sArrayElements" % t; i += 1
          for t in prims: n[i] = "Get%sArrayRegion" % t; i += 1
          for t in prims: n[i] = "Set%sArrayRegion" % t; i += 1
          assert i == 215
          for k, nm in enumerate(["RegisterNatives","UnregisterNatives","MonitorEnter","MonitorExit","GetJavaVM",
                                  "GetStringRegion","GetStringUTFRegion","GetPrimitiveArrayCritical",
                                  "ReleasePrimitiveArrayCritical","GetStringCritical","ReleaseStringCritical",
                                  "NewWeakGlobalRef","DeleteWeakGlobalRef","ExceptionCheck","NewDirectByteBuffer",
                                  "GetDirectBufferAddress","GetDirectBufferCapacity","GetObjectRefType"]):
              n[215 + k] = nm
          assert n[215]=="RegisterNatives" and n[228]=="ExceptionCheck" and n[232]=="GetObjectRefType"
          assert n[33]=="GetMethodID" and n[113]=="GetStaticMethodID" and n[169]=="GetStringUTFChars" and n[167]=="NewStringUTF"
          assert n[61]=="CallVoidMethod" and n[141]=="CallStaticVoidMethod" and n[129]=="CallStaticIntMethod"
          NT = 512
          o = []
          o.append("static const char *const jni_names[256] = {")
          for k in range(256):
              o.append('  "%s",' % n.get(k, "slot%d" % k))
          o.append("};")
          for k in range(256):
              o.append("static int jstub_%d(void) { return jni_trap(%d); }" % (k, k))
          o.append("static void *const jstubs[256] = {")
          o.append("  " + ", ".join("(void *)jstub_%d" % k for k in range(256)))
          o.append("};")
          for k in range(NT):
              o.append("static int tstub_%d(void) { return trap_unres(%d); }" % (k, k))
          o.append("#define NTSTUB %d" % NT)
          o.append("static void *const tstubs[NTSTUB] = {")
          o.append("  " + ", ".join("(void *)tstub_%d" % k for k in range(NT)))
          o.append("};")
          open("stubs.inc", "w").write("\n".join(o) + "\n")
          print("stubs.inc ok, nama terisi:", len(n))
          EOF_PY
          cat > out/WobbleM2.sh <<'EOF_SH1'
          #!/bin/bash
          # Wobble M2 loader (arm64): menjalankan Unity sampai frame pertama. Argumen dibaca dari loader.args (opsional).
          # Bawaan: --stage 3 --frames 900 --timeout 150   (stage 2 = berhenti sebelum grafis, seperti M1)
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then controlfolder="$XDG_DATA_HOME/PortMaster"
          else controlfolder="/roms/ports/PortMaster"; fi
          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
          GAMEDIR="/$directory/ports/wobble"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/wobble"
          cd "$GAMEDIR" || { echo "folder wobble tidak ketemu: /$directory/ports/wobble atau di sebelah script ini" > "$(dirname "$0")/wobble_error.txt"; exit 1; }
          chmod +x ./wobbleloader 2>/dev/null
          for L in libmain.so libunity.so libil2cpp.so; do
            if [ ! -f libs/$L ]; then echo "libs/$L belum ada di $GAMEDIR" > wobble_stdout.txt; sleep 3; exit 1; fi
          done
          if [ ! -f com.skygo.wobble.apk ]; then echo "com.skygo.wobble.apk belum ada di $GAMEDIR (WAJIB untuk M2: Unity membaca aset langsung dari APK)" > wobble_stdout.txt; sleep 3; exit 1; fi
          rm -f m2_log.txt shot_*.bmp
          ARGS="$(cat loader.args 2>/dev/null)"
          [ -z "$ARGS" ] && ARGS="--stage 3 --frames 900 --timeout 150"
          echo "GAMEDIR=$GAMEDIR args=$ARGS" > wobble_stdout.txt
          ./wobbleloader --libdir libs --apk com.skygo.wobble.apk --log m2_log.txt $ARGS >> wobble_stdout.txt 2>&1
          echo "exit code: $?" >> wobble_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH1
          echo "--stage 3 --frames 900 --timeout 150" > out/wobble/loader.args
          echo "Taruh libmain.so, libunity.so, libil2cpp.so dari lib/arm64-v8a (config.arm64_v8a.apk) ke folder ini, dan com.skygo.wobble.apk ke folder wobble. Jangan di-upload ke GitHub." > out/wobble/libs/TARUH-LIB-DI-SINI.txt

      - name: Kompilasi (aarch64)
        run: |
          (cd src && python3 gen_stubs.py)
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Wno-format-truncation -Wno-unused-parameter -Isrc -o out/wobble/wobbleloader src/wobbleloader.c -ldl -lpthread -lm
          file out/wobble/wobbleloader || true
          aarch64-linux-gnu-readelf -d out/wobble/wobbleloader | grep NEEDED
          MAXV=$(aarch64-linux-gnu-readelf -V out/wobble/wobbleloader | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "wobbleloader butuh GLIBC tertinggi: $MAXV (device: 2.37 atau lebih baru)"
          if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "GAGAL: butuh glibc lebih baru dari 2.37. Simbol penyebab:"
            aarch64-linux-gnu-nm -D --undefined-only out/wobble/wobbleloader | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
            exit 1
          fi

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: wobble-m2-arm64
          path: out
