          /* ---- sinyal: sigset_t bionic LP64 = 64-bit (bit sig-1); struct sigaction beda urutan ---- */
          typedef struct { int32_t flags; int32_t pad; uint64_t handler; uint64_t mask; uint64_t restorer; } BSA;
          static void bmask2host(uint64_t m, sigset_t *h) { int b; sigemptyset(h); for (b = 0; b < 64; b++) if (m & (1ull << b)) sigaddset(h, msig(b + 1)); }
