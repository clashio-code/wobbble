            unsigned char *px, *row; FILE *f; char name[64]; uint8_t hd[54]; uint32_t v, fs; unsigned e = 0, nz = 0, ns = 0; unsigned long sr = 0, sg = 0, sb = 0; static unsigned char seen[4096];
