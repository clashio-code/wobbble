name: build-wobble-m2
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 64-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Tulis sumber
        run: |
          mkdir -p src out/wobble/libs
          cat > src/wobbleloader.c <<'EOF_C1'
          /* wobbleloader - Milestone 2 port Wobble (digabung) (Unity 2022 IL2CPP, arm64-v8a -> Linux aarch64 / muOS).
           * Memuat libmain.so + libunity.so + libil2cpp.so (ELF64 AArch64, bionic) SENDIRI tanpa dlopen, relokasi (RELA, RELR, Android APS2,
           * TLS general-dynamic + TLSDESC), shim bionic LP64 -> glibc, JNI palsu. TIDAK ada render di M1.
           * Pakai: wobbleloader [--stage N] [--libdir DIR] [--apk FILE] [--timeout S] [--loadarg STR] [--strict] [--log FILE]
           *   stage 0 = muat + relokasi + laporan simbol (TIDAK ada kode game yang jalan)
           *   stage 1 = + konstruktor (init_array) libmain, libunity, libil2cpp
           *   stage 2 = + JNI_OnLoad(libmain) + NativeLoader.load + JNI_OnLoad(libunity) + tabel native terdaftar
           * Catatan glibc: JANGAN pakai strtol/sscanf/atoi/strlcpy dkk (header baru mengikat ke GLIBC_2.38, batas device 2.37). */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <errno.h>
          #include <elf.h>
          #include <link.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <sched.h>
          #include <time.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/syscall.h>
          #include <sys/prctl.h>
          #include <sys/utsname.h>
          #include <sys/uio.h>
          #include <gnu/libc-version.h>

          #pragma GCC diagnostic ignored "-Wdeprecated-declarations"
          #define PAGE 4096u
          #define MAXMOD 8
          #define PTRMIN 0x10000ull
          #ifndef DT_RELR
          #define DT_RELR 36
          #define DT_RELRSZ 35
          #endif
          #define DT_ANDROID_RELA 0x6000000f
          #define DT_ANDROID_RELASZ 0x60000010

          static FILE *g_log;
          static int g_stage = 2, g_strict = 0, g_timeout = 120;
          static char g_libdir[300] = "libs", g_apk[300] = "", g_loadarg[300] = "";

          static void L(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vfprintf(stdout, fmt, ap); va_end(ap); fflush(stdout);
            if (g_log) { va_start(ap, fmt); vfprintf(g_log, fmt, ap); va_end(ap); fflush(g_log); }
          }
          static int pint(const char *s) { int v = 0; while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0'); return v; }

          /* ================================================================== modul ELF */
          typedef struct { const char *name; char tag; int mod; } Imp;
          typedef struct Mod {
            char name[64];
            uint8_t *base; size_t span; uintptr_t bias;
            Elf64_Ehdr eh; Elf64_Phdr *ph; int nph;
            Elf64_Sym *sym; int nsym; const char *str;
            Elf64_Rela *rela; uint64_t relasz, jrelasz; Elf64_Rela *jrela;
            uint64_t *relr; uint64_t relrsz; uint8_t *arela; uint64_t arelasz;
            uint64_t init; uint64_t *iarr; uint32_t niarr;
            uint64_t *rval; uint8_t *rhave; char *rtag;
            uint32_t *htab; uint32_t hsize;
            int tls_id; const uint8_t *tls_img; uint64_t tls_filesz, tls_memsz, tls_align;
            const char *needed[24]; int nneeded;
            int relocated, ctors_done, symbolic;
            int n_self, n_mod, n_shim, n_libc, n_host, n_unres, n_weak0, n_tlsbad, n_irel;
            uint64_t n_reloc;
          } Mod;
          static Mod mods[MAXMOD]; static int nmods;
          static Imp g_imp[12000]; static int g_nimp;

          /* kanari stack TLS: kode bionic arm64 membaca [tp+40]. Blok TLS executable ini (tp+16..) diisi konstanta yang sama. */
          #define C8 0x5ad0c0de1badc0deULL
          static __thread uint64_t g_tls_guard[16] __attribute__((aligned(16), used)) = { C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8 };
          static int tls_guard_check(void) {
          #if defined(__aarch64__)
            uint64_t tp, v;
            __asm__ volatile("mrs %0, tpidr_el0" : "=r"(tp));
            v = *(volatile uint64_t *)(tp + 40);
            L("[tls] kanari di tp+40 = 0x%llx (harus 0x%llx) | blok TLS kita di tp+%lld -> %s\n", (unsigned long long)v, (unsigned long long)C8,
              (long long)((uintptr_t)&g_tls_guard[0] - (uintptr_t)tp), v == C8 ? "OK" : "TIDAK COCOK");
            return v == C8 ? 0 : -1;
          #else
            (void)g_tls_guard; L("[tls] (bukan aarch64: cek kanari dilewati)\n"); return 0;
          #endif
          }

          static Mod *find_mod(const char *name) { int i; for (i = 0; i < nmods; i++) if (!strcmp(mods[i].name, name)) return &mods[i]; return NULL; }
          static Mod *mod_of(uintptr_t a, uint64_t *off) {
            int i;
            for (i = 0; i < nmods; i++) if (a >= (uintptr_t)mods[i].base && a < (uintptr_t)mods[i].base + mods[i].span) { *off = a - mods[i].bias; return &mods[i]; }
            *off = a; return NULL;
          }
          static const char *game_sym(const Mod *m, uint64_t off, uint64_t *delta) {
            uint64_t best = 0; const char *nm = NULL; int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf64_Sym *y = &m->sym[i];
              if (y->st_shndx == SHN_UNDEF || !y->st_name || ELF64_ST_TYPE(y->st_info) != STT_FUNC) continue;
              if (y->st_value <= off && y->st_value >= best) { best = y->st_value; nm = m->str + y->st_name; }
            }
            *delta = off - best; return nm;
          }
          static void describe_addr(uintptr_t a, char *buf, size_t n) {
            uint64_t off, d = 0; Mod *m = mod_of(a, &off); const char *s;
            if (!m) { snprintf(buf, n, "%p (luar modul game)", (void *)a); return; }
            s = game_sym(m, off, &d);
            snprintf(buf, n, "%s+0x%llx [%s+0x%llx]", m->name, (unsigned long long)off, s ? s : "?", (unsigned long long)d);
          }

          /* ---------------- hash simbol terekspor ---------------- */
          static uint32_t fnv(const char *s) { uint32_t h = 2166136261u; for (; *s; s++) { h ^= (uint8_t)*s; h *= 16777619u; } return h | 1u; }
          static void build_htab(Mod *m) {
            uint32_t i, sz = 16, k, h;
            while (sz < (uint32_t)m->nsym * 4) sz <<= 1;
            m->htab = calloc(sz, sizeof(uint32_t)); m->hsize = sz;
            for (i = 1; i < (uint32_t)m->nsym; i++) {
              const Elf64_Sym *s = &m->sym[i];
              if (s->st_shndx == SHN_UNDEF || !s->st_name || ELF64_ST_BIND(s->st_info) == STB_LOCAL || ELF64_ST_TYPE(s->st_info) == STT_TLS) continue;
              h = fnv(m->str + s->st_name);
              for (k = h & (sz - 1); m->htab[k]; k = (k + 1) & (sz - 1)) ;
              m->htab[k] = i;
            }
          }
          static void *mod_find(const Mod *m, const char *name) {
            uint32_t h, k;
            if (!m->htab) return NULL;
            h = fnv(name);
            for (k = h & (m->hsize - 1); m->htab[k]; k = (k + 1) & (m->hsize - 1)) {
              const Elf64_Sym *s = &m->sym[m->htab[k]];
              if (!strcmp(m->str + s->st_name, name)) return (void *)(m->bias + s->st_value);
            }
            return NULL;
          }
          static const Elf64_Sym *mod_find_tls(const Mod *m, const char *name) {
            int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf64_Sym *s = &m->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && ELF64_ST_TYPE(s->st_info) == STT_TLS && !strcmp(m->str + s->st_name, name)) return s;
            }
            return NULL;
          }

          /* ================================================================== diagnostik crash */
          typedef struct { uintptr_t lo, hi; int exec; char name[110]; } MapEnt;
          static MapEnt g_me[800]; static int g_nme;
          static void maps_snapshot(void) {
            static char buf[131072];
            int fd = open("/proc/self/maps", O_RDONLY), n = 0, r; char *p, *e;
            if (fd < 0) return;
            while (n < (int)sizeof buf - 1 && (r = (int)read(fd, buf + n, sizeof buf - 1 - (size_t)n)) > 0) n += r;
            close(fd); buf[n] = 0; g_nme = 0;
            for (p = buf; *p && g_nme < 800; p = e ? e + 1 : p + strlen(p)) {
              MapEnt *m = &g_me[g_nme]; const char *q = p; int k = 0;
              e = strchr(p, '\n'); if (e) *e = 0;
              m->lo = 0; m->hi = 0;
              while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) m->lo = m->lo * 16 + (uintptr_t)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
              if (*q == '-') q++;
              while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) m->hi = m->hi * 16 + (uintptr_t)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
              if (*q == ' ') q++;
              m->exec = (q[2] == 'x');
              while (*q && k < 4) { if (*q == ' ') { k++; while (*q == ' ') q++; } else q++; }
              snprintf(m->name, sizeof m->name, "%s", q);
              if (m->hi) g_nme++;
              if (!e) break;
            }
          }
          static const MapEnt *maps_find(uintptr_t a) { int i; for (i = 0; i < g_nme; i++) if (a >= g_me[i].lo && a < g_me[i].hi) return &g_me[i]; return NULL; }
          static void maps_show(const char *tag, uintptr_t a) {
            const MapEnt *m = maps_find(a);
            if (m) L("    %s %p -> %s +0x%lx%s\n", tag, (void *)a, m->name[0] ? m->name : "(anon)", (unsigned long)(a - m->lo), m->exec ? " [exec]" : "");
            else L("    %s %p -> (tak ada di peta tersimpan)\n", tag, (void *)a);
          }
          static __thread uintptr_t t_fn;
          static volatile int g_in_sig; static int g_sig_events;
          static int safe_read(uintptr_t a, void *buf, size_t n) {   /* process_vm_readv: gagal dengan EFAULT, tidak crash */
            struct iovec lv, rv; lv.iov_base = buf; lv.iov_len = n; rv.iov_base = (void *)a; rv.iov_len = n;
            return process_vm_readv(getpid(), &lv, 1, &rv, 1, 0) == (ssize_t)n ? 0 : -1;
          }
          static void dump_mem(const char *tag, uintptr_t a, size_t n) {
            unsigned char b[128]; size_t i;
            if (n > sizeof b) n = sizeof b;
            if (safe_read(a, b, n) != 0) { L("  [mem] %s @%p: tidak terbaca\n", tag, (void *)a); return; }
            L("  [mem] %s @%p:", tag, (void *)a);
            for (i = 0; i < n; i++) L("%s%02x", i % 16 ? " " : "\n    ", b[i]);
            L("\n");
          }
          static void dump_ctx(const char *tag, int sig, siginfo_t *si, void *ctx) {
            ucontext_t *uc = (ucontext_t *)ctx; uintptr_t pc = 0, lr = 0, sp = 0; char b[300];
            (void)uc; (void)lr; (void)sp;
          #if defined(__aarch64__)
            pc = (uintptr_t)uc->uc_mcontext.pc; lr = (uintptr_t)uc->uc_mcontext.regs[30]; sp = (uintptr_t)uc->uc_mcontext.sp;
          #endif
            L("\n*** %s sinyal=%d si_code=%d addr=%p tid=%d ***\n", tag, sig, si ? si->si_code : 0, si ? si->si_addr : NULL, (int)syscall(SYS_gettid));
            describe_addr(pc, b, sizeof b); L("    pc=%p %s\n", (void *)pc, b); maps_show("pc:", pc);
            describe_addr(lr, b, sizeof b); L("    lr=%p %s\n", (void *)lr, b); maps_show("lr:", lr);
            if (t_fn) { describe_addr(t_fn, b, sizeof b); L("    fungsi awal thread: %s\n", b); }
          #if defined(__aarch64__)
            {
              int k; uintptr_t fp = (uintptr_t)uc->uc_mcontext.regs[29], w, end; const MapEnt *sm = maps_find(sp); int shown = 0;
              for (k = 0; k < 30; k += 3)
                L("    x%-2d=%016llx x%-2d=%016llx x%-2d=%016llx\n", k, (unsigned long long)uc->uc_mcontext.regs[k], k + 1, (unsigned long long)uc->uc_mcontext.regs[k + 1], k + 2, (unsigned long long)uc->uc_mcontext.regs[k + 2]);
              {
                uint32_t cw[24]; int q;
                if (safe_read(pc - 64, cw, sizeof cw) == 0) { L("  [kode] word32 dari pc-64 (pc = indeks 16):"); for (q = 0; q < 24; q++) L("%s%08x", q % 8 ? " " : "\n    ", cw[q]); L("\n"); }
                if (si && si->si_addr) dump_mem("alamat fault -16", (uintptr_t)si->si_addr - 16, 64);
                dump_mem("x0", (uintptr_t)uc->uc_mcontext.regs[0], 64);
              }
              L("  [bt] rantai frame-pointer dari x29=%p:\n", (void *)fp);
              for (k = 0; k < 32 && fp && !(fp & 7) && fp >= sp - 4096 && fp < sp + 0x800000; k++) {
                const uintptr_t *fr = (const uintptr_t *)fp; uintptr_t ra = fr[1], nfp = fr[0];
                describe_addr(ra, b, sizeof b); L("   #%d ra=%p %s\n", k, (void *)ra, b);
                if (nfp <= fp) break;
                fp = nfp;
              }
              end = sm ? sm->hi : sp + 4096;
              L("  [stack-exec] kata di stack yang menunjuk ke kode:\n");
              for (w = sp; w + 8 <= end && shown < 20; w += 8) {
                uintptr_t v = *(const uintptr_t *)w; const MapEnt *m = maps_find(v);
                if (m && m->exec) { describe_addr(v, b, sizeof b); L("    sp+%lu: %p -> %s | %s\n", (unsigned long)(w - sp), (void *)v, m->name[0] ? m->name : "(anon)", b); shown++; }
              }
            }
          #endif
          }
          static void on_sig(int sig, siginfo_t *si, void *ctx) {
            if (g_in_sig++) _exit(128 + sig);
            dump_ctx("CRASH", sig, si, ctx);
            _exit(128 + sig);
          }
          static void on_alarm(int sig) { (void)sig; L("\n*** WATCHDOG: waktu habis, proses dihentikan ***\n"); _exit(4); }

          /* ================================================================== TLS general-dynamic + TLSDESC */
          typedef struct { uint64_t mod, off; } TlsIdx;
          static __thread void *t_tls[MAXMOD + 2];
          static Mod *g_tlsmod[MAXMOD + 2]; static int g_ntls;
          static void *tls_block(int id) {
            Mod *m;
            if (id <= 0 || id > g_ntls) return NULL;
            m = g_tlsmod[id];
            if (!t_tls[id]) {
              size_t al = m->tls_align < 16 ? 16 : (size_t)m->tls_align; void *p = NULL;
              if (posix_memalign(&p, al, m->tls_memsz ? (size_t)m->tls_memsz : 1)) return NULL;
              memset(p, 0, (size_t)m->tls_memsz); memcpy(p, m->tls_img, (size_t)m->tls_filesz);
              t_tls[id] = p;
            }
            return t_tls[id];
          }
          static void *b_tls_get_addr(TlsIdx *ti) {
            char *b = tls_block((int)ti->mod);
            if (!b) { L("*** __tls_get_addr: modul TLS %llu tak dikenal\n", (unsigned long long)ti->mod); abort(); }
            return b + ti->off;
          }
          __attribute__((used, visibility("hidden"))) void *tlsdesc_c(TlsIdx *ti) { return b_tls_get_addr(ti); }
          #if defined(__aarch64__)
          extern void tlsdesc_resolver(void);
          __asm__(
            ".text\n.align 4\n.global tlsdesc_resolver\n.hidden tlsdesc_resolver\n.type tlsdesc_resolver,%function\n"
            "tlsdesc_resolver:\n"
            "  stp x29, x30, [sp, #-16]!\n  mov x29, sp\n  sub sp, sp, #288\n"
            "  stp x1, x2, [sp, #0]\n  stp x3, x4, [sp, #16]\n  stp x5, x6, [sp, #32]\n  stp x7, x8, [sp, #48]\n"
            "  stp x9, x10, [sp, #64]\n  stp x11, x12, [sp, #80]\n  stp x13, x14, [sp, #96]\n  stp x15, x16, [sp, #112]\n  stp x17, x18, [sp, #128]\n"
            "  stp q0, q1, [sp, #144]\n  stp q2, q3, [sp, #176]\n  stp q4, q5, [sp, #208]\n  stp q6, q7, [sp, #240]\n"
            "  ldr x0, [x0, #8]\n  bl tlsdesc_c\n  mrs x1, tpidr_el0\n  sub x0, x0, x1\n"
            "  ldp q6, q7, [sp, #240]\n  ldp q4, q5, [sp, #208]\n  ldp q2, q3, [sp, #176]\n  ldp q0, q1, [sp, #144]\n"
            "  ldp x17, x18, [sp, #128]\n  ldp x15, x16, [sp, #112]\n  ldp x13, x14, [sp, #96]\n  ldp x11, x12, [sp, #80]\n  ldp x9, x10, [sp, #64]\n"
            "  ldp x7, x8, [sp, #48]\n  ldp x5, x6, [sp, #32]\n  ldp x3, x4, [sp, #16]\n  ldp x1, x2, [sp, #0]\n"
            "  add sp, sp, #288\n  ldp x29, x30, [sp], #16\n  ret\n"
            /* setjmp/longjmp bionic: jmp_buf bionic hanya 256 byte, jadi tulis sendiri (x19-x30, sp, d8-d15 = 168 byte) */
            ".global shim_setjmp\n.type shim_setjmp,%function\nshim_setjmp:\n"
            "  stp x19, x20, [x0, #0]\n  stp x21, x22, [x0, #16]\n  stp x23, x24, [x0, #32]\n  stp x25, x26, [x0, #48]\n  stp x27, x28, [x0, #64]\n"
            "  stp x29, x30, [x0, #80]\n  mov x2, sp\n  str x2, [x0, #96]\n  stp d8, d9, [x0, #104]\n  stp d10, d11, [x0, #120]\n"
            "  stp d12, d13, [x0, #136]\n  stp d14, d15, [x0, #152]\n  mov x0, #0\n  ret\n"
            ".global shim_longjmp\n.type shim_longjmp,%function\nshim_longjmp:\n"
            "  ldp x19, x20, [x0, #0]\n  ldp x21, x22, [x0, #16]\n  ldp x23, x24, [x0, #32]\n  ldp x25, x26, [x0, #48]\n  ldp x27, x28, [x0, #64]\n"
            "  ldp x29, x30, [x0, #80]\n  ldr x2, [x0, #96]\n  mov sp, x2\n  ldp d8, d9, [x0, #104]\n  ldp d10, d11, [x0, #120]\n"
            "  ldp d12, d13, [x0, #136]\n  ldp d14, d15, [x0, #152]\n  cmp w1, #0\n  csinc w0, w1, wzr, ne\n  ret\n"
          );
          extern void shim_setjmp(void);
          extern void shim_longjmp(void);
          #else
          static void tlsdesc_resolver(void) {}
          static void shim_setjmp(void) {}
          static void shim_longjmp(void) {}
          #endif

          /* ================================================================== shim bionic -> glibc */
          static int trap_unres(int i);
          static int jni_trap(int i);
          #include "stubs.inc"
          static const char *unres_name[NTSTUB]; static int nunres; static unsigned g_trapcnt[NTSTUB];
          static int trap_unres(int i) {
            unsigned c; char b[300];
            if (i < 0 || i >= NTSTUB) return 0;
            c = ++g_trapcnt[i];
            if (c <= 3 || (c & (c - 1)) == 0) { describe_addr((uintptr_t)__builtin_return_address(0), b, sizeof b); L("[STUB] %s dipanggil (#%u) dari %s\n", i < nunres ? unres_name[i] : "?", c, b); }
            if (g_strict) { L("[STUB] --strict: berhenti\n"); _exit(3); }
            return 0;
          }

          #define BSF 152
          static char bionic_sF[3 * BSF];
          static FILE *xf(FILE *f) {
            uintptr_t a = (uintptr_t)f, b = (uintptr_t)bionic_sF;
            if (a >= b && a < b + sizeof bionic_sF) { unsigned i = (unsigned)((a - b) / BSF); return i == 0 ? stdin : i == 1 ? stdout : stderr; }
            return f;
          }
          static int b_fprintf(FILE *f, const char *fmt, ...) { va_list ap; int r; va_start(ap, fmt); r = vfprintf(xf(f), fmt, ap); va_end(ap); return r; }
          static int b_vfprintf(FILE *f, const char *fmt, va_list ap) { return vfprintf(xf(f), fmt, ap); }
          static int b_fputs(const char *s, FILE *f) { return fputs(s, xf(f)); }
          static int b_fputc(int c, FILE *f) { return fputc(c, xf(f)); }
          static size_t b_fwrite(const void *p, size_t s, size_t n, FILE *f) { return fwrite(p, s, n, xf(f)); }
          static size_t b_fread(void *p, size_t s, size_t n, FILE *f) { return fread(p, s, n, xf(f)); }
          static int b_fflush(FILE *f) { return fflush(f ? xf(f) : NULL); }
          static char *b_fgets(char *b, int n, FILE *f) { return fgets(b, n, xf(f)); }
          static int b_ferror(FILE *f) { return ferror(xf(f)); }
          static int b_fclose(FILE *f) { FILE *m = xf(f); if (m == stdin || m == stdout || m == stderr) return fflush(m); return fclose(m); }
          static int b_setvbuf(FILE *f, char *b, int m, size_t s) { return setvbuf(xf(f), b, m, s); }

          static size_t b_strlen_chk(const char *s, size_t n) { size_t l = strlen(s); if (l >= n) { L("*** __strlen_chk: overflow\n"); abort(); } return l; }
          static char *b_strchr_chk(const char *s, int c, size_t n) { char *r = strchr(s, c); (void)n; return r; }
