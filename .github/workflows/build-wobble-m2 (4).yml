          static void chain_handler(int sig, siginfo_t *si, void *ucv) {
            BSA *h = &g_gh[sig];
            if (t_in_chain[sig]) { L("[SHIM] sinyal %d diulang di dalam handler game -> keluar\n", sig); _exit(128 + sig); }
            t_in_chain[sig] = 1;
            if (g_sig_events++ < 8) dump_ctx("SINYAL diterima (diteruskan ke handler game)", sig, si, ucv);
            if (h->flags & 4) ((void (*)(int, siginfo_t *, void *))(uintptr_t)h->handler)(sig, si, ucv);
            else ((void (*)(int))(uintptr_t)h->handler)(sig);
            t_in_chain[sig] = 0;
