              hd[0] = 'B'; hd[1] = 'M'; memcpy(hd + 2, &fs, 4); v = 54; memcpy(hd + 10, &v, 4); v = 40; memcpy(hd + 14, &v, 4);
              v = (uint32_t)w; memcpy(hd + 18, &v, 4); v = (uint32_t)h; memcpy(hd + 22, &v, 4); hd[26] = 1; hd[28] = 24; v = (uint32_t)(rowb * (size_t)h); memcpy(hd + 34, &v, 4);
              fwrite(hd, 1, 54, f);
