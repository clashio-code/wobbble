              info.dlpi_addr = (ElfW(Addr))mods[i].bias; info.dlpi_name = mods[i].name; info.dlpi_phdr = (const ElfW(Phdr) *)mods[i].ph;
              info.dlpi_phnum = (ElfW(Half))mods[i].nph; info.dlpi_adds = (unsigned long long)nmods;
